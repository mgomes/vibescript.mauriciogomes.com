{{define "layout"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Page.Title}} | Vibescript</title>
    <meta name="description" content="{{.Page.Description}}">
    <script>
      (function() {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="/static/site.css?v={{.CacheBust}}">
    <script src="/static/site.js?v={{.CacheBust}}" defer></script>
  </head>
  <body>
    <svg width="0" height="0" class="brand-sprite" aria-hidden="true" focusable="false">
      <symbol id="spark" viewBox="0 0 24 24"><path d="M12 0C12 6.6 17.4 12 24 12 17.4 12 12 17.4 12 24 12 17.4 6.6 12 0 12 6.6 12 12 6.6 12 0Z"/></symbol>
      <symbol id="vee" viewBox="0 0 85 73"><polygon points="31.188 73 52.992 73 84.18 0 60.444 0 42.366 44.712 24.288 0 0 0"/></symbol>
    </svg>
    <div class="site-shell">
      <header class="site-header fade-in">
        <a href="/" class="brand" aria-label="Vibescript home">
          <img src="/static/logo-dark.svg" alt="Vibescript" class="brand-logo brand-logo-dark">
          <img src="/static/logo-light.svg" alt="Vibescript" class="brand-logo brand-logo-light">
          <span class="brand-version">{{.UpstreamVersion}}</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="/" {{if eq .Page.Section "home"}}class="is-active"{{end}}>Home</a>
          <a href="/examples" {{if eq .Page.Section "examples"}}class="is-active"{{end}}>Examples</a>
          <a href="{{.UpstreamRepoURL}}">GitHub</a>
          <button class="theme-toggle" type="button" aria-label="Toggle theme" data-theme-toggle>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </nav>
      </header>

      {{.Content}}

      <footer class="site-footer">
        <span class="site-footer-mark"><svg class="spark"><use href="#spark"></use></svg> &copy; {{.Year}} Mauricio Gomes. MIT licensed.</span>
        <div class="site-footer-links">
          <a href="/examples">Examples</a>
          <a href="{{.UpstreamRepoURL}}">GitHub</a>
        </div>
      </footer>
    </div>
  </body>
</html>
{{end}}
